[project]
name = "whatsapp-context"
version = "0.2.0"
description = "Read-only, policy-filtered WhatsApp for Mac context for local AI assistants (MCP server + CLI)"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[project.scripts]
wa = "whatsapp_context.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
